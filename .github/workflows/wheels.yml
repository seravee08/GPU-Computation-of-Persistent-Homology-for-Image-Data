name: build-wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: seravee08/topogpu:v2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain
        shell: bash
        run: |
          ls -la /root/.local/bin || echo "no /root/.local/bin"
          ls /opt/python || echo "no /opt/python"
          find / -maxdepth 4 -name uv -type f 2>/dev/null
          find / -maxdepth 5 -name "python3.12" -type f 2>/dev/null | head

      - name: Build binary and wheels
        shell: bash
        run: |
          export PATH=/root/.local/bin:/opt/rh/gcc-toolset-12/root/usr/bin:/opt/python/cpython-3.12.15-linux-x86_64-gnu/bin:/usr/local/cuda/bin:$PATH
          export LD_LIBRARY_PATH=/opt/rh/gcc-toolset-12/root/usr/lib64:/usr/local/cuda/lib64
          export CC=gcc CXX=g++ UV_PYTHON_INSTALL_DIR=/opt/python
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build.sh

      - name: Smoke test
        shell: bash
        run: |
          export PATH=/opt/python/cpython-3.12.15-linux-x86_64-gnu/bin:$PATH
          python -m pip install --break-system-packages dist/topogpu-*-cp312-*.whl
          python -c "import topogpu; print('import ok')"